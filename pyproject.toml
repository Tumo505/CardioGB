[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiogb"
version = "0.1.0"
description = "Grey-box graph neural differential equations for spatial cardiac regeneration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anndata>=0.10",
  "h5py>=3.10",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "torch>=2.5",
]

[project.optional-dependencies]
ode = ["torchdiffeq>=0.2.4"]
graph = ["torch-geometric>=2.6"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]

[project.scripts]
cardiogb-inspect-data = "cardiogb.cli.inspect_data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

