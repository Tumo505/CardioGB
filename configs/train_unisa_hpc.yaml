seed: 20260815
device: auto
epochs: 200
learning_rate: 0.0005
weight_decay: 0.0001
mechanistic_learning_rate_scale: 0.5
warm_start_epochs: 5
early_stopping_patience: 25
mixed_precision: true
# The UNISA guide documents a Tesla P100. Pascal GPUs do not natively support
# bfloat16, so use float16 AMP on this cluster.
amp_dtype: float16
cuda_memory_fraction: 0.94
cooldown_seconds: 0
thermal_cooldown_every_epochs: 5
thermal_cooldown_seconds: 0
ensemble_size: 5
max_distribution_samples: 1024
max_ode_steps_per_transition: 96
force_float32_integration: false
gradient_checkpointing: true
gradient_checkpoint_interval: 1
batching:
  unit: section
  max_nodes: 8000
  patches_per_transition_per_epoch: 8
  patch_batch_size: 8
loss:
  lambda_distribution: 1.0
  lambda_moments: 0.25
  lambda_wasserstein: 0.25
  lambda_spatial: 0.001
  lambda_biology: 0.1
  lambda_residual: 0.001
  lambda_persistence_regret: 0.5
  lambda_stability: 0.05
  lambda_semigroup: 0.1
multi_horizon:
  enabled: true
  curriculum_epochs: 30
  stability_velocity_target: 0.35
